[project]
name = "github-api"
version = "0.1.0"
description = "The LUCY family's repos service: GitHub, reduced to what a person would say about it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "REX Technologies" }]
keywords = ["fastapi", "github", "keyring", "lucy"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring-client",
    "lucy-signals",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
github-api = "github_api.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/Github-api"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "cryptography>=43.0",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "EM", "ERA", "F", "FA",
    "I", "ICN", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# The site checker is a command-line gate: printing its findings is its job.
"scripts/check_site.py" = ["T201"]
"src/github_api/api/routers/*" = ["TC001", "TC002", "TC003"]
"src/github_api/api/dependencies.py" = ["TC001", "TC002", "TC003"]
"src/github_api/api/errors.py" = ["TC001", "TC002", "TC003"]
"src/github_api/api/schemas.py" = ["TC001", "TC002", "TC003"]
"src/github_api/github/models.py" = ["TC001", "TC002", "TC003"]
"src/github_api/github/fake.py" = ["ARG002", "EM102"]
"tests/**" = [
    "ARG001", "ARG002", "S101", "S105", "S106", "S107", "SLF001",
    "PLR2004", "TC001", "TC002", "TC003", "PLC0415", "PLR0913", "PLR0917",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["github_api"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["keyring_client.*", "lucy_signals.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["github_api"]
omit = ["src/github_api/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.$",
]

[tool.importlinter]
root_package = "github_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers do not speak keyring, HTTP or JWT directly"
type = "forbidden"
source_modules = ["github_api.api.routers"]
forbidden_modules = ["keyring_client", "httpx", "jwt", "lucy_signals", "sqlite3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Layers: the HTTP surface on top, GitHub and keyring at the bottom"
type = "layers"
layers = [
    "github_api.api",
    "github_api.container",
    "github_api.jobs",
    "github_api.access",
    "github_api.credentials",
    "github_api.auth | github_api.github",
    "github_api.core",
]

[[tool.importlinter.contracts]]
name = "The GitHub layer knows nothing of keyring or signals"
type = "forbidden"
source_modules = ["github_api.github"]
forbidden_modules = ["keyring_client", "lucy_signals", "fastapi"]

[[tool.importlinter.contracts]]
name = "Credentials know nothing of routes or signals"
type = "forbidden"
source_modules = ["github_api.credentials"]
forbidden_modules = ["fastapi", "lucy_signals"]

[tool.uv.sources]
keyring-client = { git = "https://github.com/tochi-mba/Keyring-api", subdirectory = "clients/python", tag = "keyring-client-v0.1.0" }
lucy-signals = { git = "https://github.com/tochi-mba/LUCY-assistant", subdirectory = "clients/python/lucy_signals", tag = "lucy-signals-v0.1.0" }
